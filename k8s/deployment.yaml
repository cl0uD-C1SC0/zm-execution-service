# execution-service: fila de execução (MongoDB). Participante da Saga:
# consome execution.commands e publica em os.events.
# A tag da imagem é trocada pelo SHA do commit no pipeline (sed no job de deploy).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-service
  namespace: zm
  labels:
    app: execution-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: execution-service
  template:
    metadata:
      labels:
        app: execution-service
    spec:
      imagePullSecrets:
        - name: dockerhub-credentials
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mongo 27017; do echo "aguardando mongo..."; sleep 2; done
              until nc -z rabbitmq 5672; do echo "aguardando rabbitmq..."; sleep 2; done
      containers:
        - name: execution-service
          image: jayakuza/zm-execution-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: execution-service-cfg
            - secretRef:
                name: execution-service-sec
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
